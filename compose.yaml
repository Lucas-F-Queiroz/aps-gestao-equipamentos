services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: aps_equipamentos
      MYSQL_USER: aps
      MYSQL_PASSWORD: aps_local
      MYSQL_ROOT_PASSWORD: root_local_apenas_desenvolvimento
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - aps_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uaps -paps_local --silent"]
      interval: 5s
      timeout: 5s
      retries: 25
volumes:
  aps_mysql_data:
