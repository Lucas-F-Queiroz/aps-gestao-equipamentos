name: Build Java (Maven)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar projeto (sem executar teste de banco)
        run: mvn -B -ntp -DskipTests package

      - name: Validar campos da configuracao (sem banco)
        run: java -cp "target/classes:target/test-classes" br.com.aps.util.DatabaseConfigManualCheck

      - name: Validar CPF e celular (sem banco)
        run: java -cp "target/classes:target/test-classes" br.com.aps.integracao.APSPessoaValidacaoCheck
