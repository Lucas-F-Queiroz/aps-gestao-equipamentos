name: Validar APS com MySQL e Swing

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integracao:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: aps_equipamentos
          MYSQL_USER: aps
          MYSQL_PASSWORD: teste-local
          MYSQL_ROOT_PASSWORD: senha-root-temporaria
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uaps -pteste-local"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Conexao temporaria (nao sao credenciais pessoais)
        run: |
          cat > src/main/resources/application.properties <<'EOF'
          db.url=jdbc:mysql://127.0.0.1:3306/aps_equipamentos?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
          db.user=aps
          db.password=teste-local
          EOF
      - name: Compilar e preparar testes de integracao
        run: mvn -B -ntp -DskipTests package dependency:copy-dependencies -DoutputDirectory=target/dependency
      - name: Exercitar DAOs
        run: |
          for classe in UsuarioDAOManualTest EquipamentoDAOManualCheck EmprestimoDAOManualCheck; do
            java -cp "target/classes:target/test-classes:target/dependency/*" "br.com.aps.dao.$classe"
          done
      - name: Exercitar Controllers e regras
        run: java -cp "target/classes:target/test-classes:target/dependency/*" br.com.aps.integracao.APSFluxoCheck
      - name: Verificar tres criterios de ordenacao
        run: java -cp "target/classes:target/test-classes:target/dependency/*" br.com.aps.integracao.APSOrdenacaoCheck
      - name: Preparar display virtual
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Abrir telas Swing em display virtual
        run: xvfb-run -a java -cp "target/classes:target/test-classes:target/dependency/*" br.com.aps.integracao.APSViewCheck
      - name: Validar clone sem application.properties usando Docker Compose
        run: |
          docker compose config --quiet
          trap 'docker compose down -v' EXIT
          docker compose up -d --wait mysql
          rm -f src/main/resources/application.properties target/classes/application.properties
          java -cp "target/classes:target/test-classes:target/dependency/*" br.com.aps.integracao.APSFluxoCheck
