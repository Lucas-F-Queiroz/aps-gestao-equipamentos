name: Limpeza temporaria de branches integradas

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remover-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Excluir apenas branches de PRs ja mergeados
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for item in \
            '1|chore/estrutura-inicial' \
            '2|feat/usuario-dao' \
            '3|feat/equipamento-dao' \
            '4|feat/emprestimo-dao'; do
            numero="${item%%|*}"
            branch="${item#*|}"
            merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${numero}" --jq '.merged')"
            if [[ "${merged}" != 'true' ]]; then
              echo "Ignorando ${branch}: PR ${numero} nao esta mergeado"
              exit 1
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --silent >/dev/null 2>&1; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              echo "Excluida: ${branch}"
            else
              echo "Ja ausente: ${branch}"
            fi
          done
